<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5494"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23a2b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#256b45"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f6f9fd"/>

  <!-- Title -->
  <text x="40" y="54" font-size="32" font-weight="700" fill="#17304f">API Incident Diagnosis Agent</text>
  <text x="40" y="86" font-size="17" fill="#4a607c">Architecture of the LLM agent: the model chooses every step, the program keeps it grounded in evidence</text>

  <!-- Input -->
  <rect x="30" y="130" width="220" height="160" rx="6" fill="#ffffff" stroke="#17304f" stroke-width="1.5"/>
  <rect x="30" y="130" width="220" height="40" rx="6" fill="#17304f"/>
  <rect x="30" y="160" width="220" height="10" fill="#17304f"/>
  <text x="140" y="156" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Input</text>
  <text x="48" y="198" font-size="14" fill="#17304f">Engineer or evaluate.py</text>
  <text x="48" y="222" font-size="14" fill="#17304f">Incident folder</text>
  <text x="48" y="246" font-size="14" fill="#17304f">+ failed request ID</text>
  <text x="48" y="272" font-size="12.5" font-family="Menlo, monospace" fill="#4a607c">llm_agent.py</text>

  <!-- Output -->
  <rect x="30" y="640" width="220" height="180" rx="6" fill="#ffffff" stroke="#17304f" stroke-width="1.5"/>
  <rect x="30" y="640" width="220" height="40" rx="6" fill="#17304f"/>
  <rect x="30" y="670" width="220" height="10" fill="#17304f"/>
  <text x="140" y="666" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Output: JSON report</text>
  <text x="48" y="708" font-size="14" fill="#17304f">outcome, summary</text>
  <text x="48" y="732" font-size="14" fill="#17304f">citations + evidence</text>
  <text x="48" y="756" font-size="14" fill="#17304f">next_record (if unresolved)</text>
  <text x="48" y="780" font-size="14" fill="#17304f">decisions (every step)</text>
  <text x="48" y="804" font-size="14" fill="#17304f">verification</text>

  <!-- Panel 1: decision loop -->
  <rect x="290" y="120" width="620" height="440" rx="8" fill="#eaf2fd"/>
  <text x="310" y="150" font-size="17" font-weight="700" fill="#17304f">1  Decision loop: the model chooses every step</text>

  <!-- Model -->
  <rect x="315" y="172" width="250" height="124" rx="6" fill="#ffffff" stroke="#2a5494" stroke-width="1.5"/>
  <rect x="315" y="172" width="250" height="36" rx="6" fill="#2a5494"/>
  <rect x="315" y="198" width="250" height="10" fill="#2a5494"/>
  <text x="440" y="196" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Ollama model (qwen2.5:7b)</text>
  <text x="330" y="232" font-size="13.5" fill="#17304f">Runs locally, free</text>
  <text x="330" y="254" font-size="13.5" fill="#17304f">Sees every result so far</text>
  <text x="330" y="276" font-size="13.5" fill="#17304f">Replies: one action + reason</text>

  <!-- Tool runner -->
  <rect x="655" y="172" width="230" height="124" rx="6" fill="#ffffff" stroke="#2a5494" stroke-width="1.5"/>
  <rect x="655" y="172" width="230" height="36" rx="6" fill="#2a5494"/>
  <rect x="655" y="198" width="230" height="10" fill="#2a5494"/>
  <text x="770" y="196" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Tool runner (Python)</text>
  <text x="670" y="232" font-size="13.5" fill="#17304f">Runs only the tool asked for</text>
  <text x="670" y="254" font-size="13.5" fill="#17304f">Request ID fixed by program</text>
  <text x="670" y="276" font-size="13.5" fill="#17304f">Keeps an evidence notebook</text>

  <!-- Model <-> runner -->
  <line x1="565" y1="222" x2="653" y2="222" stroke="#2a5494" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="610" y="214" font-size="12.5" fill="#2a5494" text-anchor="middle">action</text>
  <line x1="655" y1="262" x2="567" y2="262" stroke="#2a5494" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="610" y="282" font-size="12.5" fill="#2a5494" text-anchor="middle">result</text>

  <!-- Input -> model -->
  <path d="M250,210 L313,210" stroke="#2a5494" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- finish / rejected arrows -->
  <line x1="520" y1="296" x2="520" y2="343" stroke="#2a5494" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="530" y="326" font-size="12.5" fill="#2a5494">finish(outcome, summary)</text>
  <line x1="350" y1="345" x2="350" y2="298" stroke="#b23a2b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="360" y="326" font-size="12.5" fill="#b23a2b">rejected + reason</text>

  <!-- Guardrails -->
  <rect x="315" y="345" width="570" height="192" rx="6" fill="#fff3e0" stroke="#b26a00" stroke-width="1.5"/>
  <rect x="315" y="345" width="570" height="34" rx="6" fill="#8a5300"/>
  <rect x="315" y="369" width="570" height="10" fill="#8a5300"/>
  <text x="330" y="368" font-size="15" font-weight="700" fill="#ffffff">2  Guardrails: is this finish allowed?</text>
  <text x="332" y="403" font-size="13.5" fill="#3d2a00">✓  The outcome is supported by records the model has seen</text>
  <text x="332" y="425" font-size="13.5" fill="#3d2a00">✓  Logs were read for every service the request reached</text>
  <text x="332" y="447" font-size="13.5" fill="#3d2a00">✓  Inventory health was checked at the timeout's timestamp</text>
  <text x="332" y="469" font-size="13.5" fill="#3d2a00">✓  The summary claims no cause ("due to", "unhealthy", ...)</text>
  <text x="332" y="491" font-size="13.5" fill="#3d2a00">✓  Insufficient evidence: the summary names no failure location</text>
  <text x="332" y="513" font-size="13.5" fill="#3d2a00">✓  next_record describes a missing record, not an existing ID</text>


  <!-- Panel 3: tools and evidence -->
  <rect x="950" y="120" width="620" height="440" rx="8" fill="#eef1f6"/>
  <text x="970" y="150" font-size="17" font-weight="700" fill="#17304f">Read-only tools and saved evidence</text>

  <g font-size="13">
    <rect x="975" y="172" width="280" height="74" rx="6" fill="#ffffff" stroke="#8796ab" stroke-width="1.2"/>
    <text x="990" y="201" font-size="13.5" font-weight="700" font-family="Menlo, monospace" fill="#17304f">read_logs(service)</text>
    <text x="990" y="225" fill="#4a607c">This request's events from one service</text>
    <line x1="1255" y1="209" x2="1298" y2="209" stroke="#2a5494" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="1300" y="172" width="245" height="74" rx="6" fill="#dfe7f3" stroke="#8796ab" stroke-width="1.2"/>
    <text x="1315" y="201" font-size="13.5" font-weight="700" font-family="Menlo, monospace" fill="#17304f">logs.jsonl</text>
    <text x="1315" y="225" fill="#4a607c">Gateway, Order, Inventory events</text>

    <rect x="975" y="282" width="280" height="74" rx="6" fill="#ffffff" stroke="#8796ab" stroke-width="1.2"/>
    <text x="990" y="311" font-size="12.5" font-weight="700" font-family="Menlo, monospace" fill="#17304f">inspect_dependencies(svc, route)</text>
    <text x="990" y="335" fill="#4a607c">Which service is called next</text>
    <line x1="1255" y1="319" x2="1298" y2="319" stroke="#2a5494" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="1300" y="282" width="245" height="74" rx="6" fill="#dfe7f3" stroke="#8796ab" stroke-width="1.2"/>
    <text x="1315" y="311" font-size="13.5" font-weight="700" font-family="Menlo, monospace" fill="#17304f">dependencies.json</text>
    <text x="1315" y="335" fill="#4a607c">Route map between services</text>

    <rect x="975" y="392" width="280" height="74" rx="6" fill="#ffffff" stroke="#8796ab" stroke-width="1.2"/>
    <text x="990" y="421" font-size="12.5" font-weight="700" font-family="Menlo, monospace" fill="#17304f">check_endpoint_status(svc, time)</text>
    <text x="990" y="445" fill="#4a607c">Health checks near a timestamp</text>
    <line x1="1255" y1="429" x2="1298" y2="429" stroke="#2a5494" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="1300" y="392" width="245" height="74" rx="6" fill="#dfe7f3" stroke="#8796ab" stroke-width="1.2"/>
    <text x="1315" y="421" font-size="13.5" font-weight="700" font-family="Menlo, monospace" fill="#17304f">endpoint_status.json</text>
    <text x="1315" y="445" fill="#4a607c">Readiness probes and results</text>
  </g>
  <!-- Runner -> evidence -->
  <line x1="885" y1="232" x2="973" y2="209" stroke="#2a5494" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="918" y="208" font-size="12" fill="#2a5494" text-anchor="middle">read-only</text>
  <text x="975" y="500" font-size="13" font-style="italic" fill="#4a607c">Every case includes decoys: other requests' events,</text>
  <text x="975" y="520" font-size="13" font-style="italic" fill="#4a607c">stale health checks, and checks of the wrong service.</text>

  <!-- accepted -> report -->
  <line x1="600" y1="537" x2="600" y2="598" stroke="#256b45" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="610" y="574" font-size="12.5" fill="#256b45">accepted</text>

  <!-- Panel 3: report -->
  <rect x="290" y="600" width="620" height="240" rx="8" fill="#e8f5ec"/>
  <text x="310" y="630" font-size="17" font-weight="700" fill="#17304f">3  Report builder</text>
  <text x="312" y="664" font-size="14" fill="#1d3a2a">From the model: outcome, summary, next_record</text>
  <text x="312" y="692" font-size="14" fill="#1d3a2a">Citations: taken from the records the model actually saw,</text>
  <text x="312" y="712" font-size="14" fill="#1d3a2a">never typed by the model, so every cited ID is real</text>
  <text x="312" y="740" font-size="14" fill="#1d3a2a">Evidence: one line per cited record, in time order</text>
  <text x="312" y="768" font-size="14" fill="#1d3a2a">Decisions: every step with its reason and tool result</text>
  <text x="312" y="796" font-size="14" fill="#1d3a2a">Rejected finishes are kept, so the demo shows them</text>

  <!-- Panel 4: verification -->
  <rect x="950" y="600" width="620" height="240" rx="8" fill="#efeaf8"/>
  <text x="970" y="630" font-size="17" font-weight="700" fill="#17304f">4  Independent verification</text>

  <rect x="975" y="648" width="260" height="146" rx="6" fill="#ffffff" stroke="#55407f" stroke-width="1.5"/>
  <rect x="975" y="648" width="260" height="34" rx="6" fill="#55407f"/>
  <rect x="975" y="672" width="260" height="10" fill="#55407f"/>
  <text x="1105" y="671" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Rule-based agent</text>
  <text x="990" y="708" font-size="13.5" fill="#2b2140">agent.py, no model</text>
  <text x="990" y="730" font-size="13.5" fill="#2b2140">Reads the same evidence files</text>
  <text x="990" y="752" font-size="13.5" fill="#2b2140">Fixed rules, same answer</text>
  <text x="990" y="774" font-size="13.5" fill="#2b2140">every time: the answer key</text>

  <rect x="1300" y="648" width="245" height="146" rx="6" fill="#ffffff" stroke="#55407f" stroke-width="1.5"/>
  <rect x="1300" y="648" width="245" height="34" rx="6" fill="#55407f"/>
  <rect x="1300" y="672" width="245" height="10" fill="#55407f"/>
  <text x="1422" y="671" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Compare</text>
  <text x="1315" y="708" font-size="13.5" fill="#2b2140">Same outcome?</text>
  <text x="1315" y="730" font-size="13.5" fill="#2b2140">Same citations?</text>
  <text x="1315" y="752" font-size="13.5" fill="#2b2140">Right next_record service?</text>
  <text x="1315" y="776" font-size="13.5" font-weight="700" fill="#2b2140">verified: true / false</text>

  <line x1="1235" y1="721" x2="1298" y2="721" stroke="#55407f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- evidence files -> rule-based agent -->
  <line x1="1215" y1="560" x2="1215" y2="646" stroke="#2a5494" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1225" y="590" font-size="12.5" fill="#2a5494">same evidence files</text>

  <!-- report -> compare -->
  <path d="M910,816 L1422,816 L1422,796" stroke="#256b45" stroke-width="1.8" fill="none" marker-end="url(#arrow-green)"/>
  <text x="960" y="810" font-size="12.5" fill="#256b45">model's report</text>

  <!-- compare -> output -->
  <path d="M1545,721 L1585,721 L1585,865 L140,865 L140,822" stroke="#17304f" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="860" y="858" font-size="13" fill="#17304f" text-anchor="middle">report + verification result</text>

  <!-- Advisor band -->
  <rect x="30" y="890" width="1540" height="90" rx="8" fill="#ece6f6"/>
  <text x="50" y="920" font-size="16" font-weight="700" fill="#17304f">Optional follow-up: Telemetry Advisor  <tspan font-weight="400" font-size="13" font-family="Menlo, monospace" fill="#4a607c">agent.py advisor</tspan></text>
  <text x="50" y="945" font-size="14" fill="#2b2140">For an unresolved Order-to-Inventory timeout, offline replay scores which single extra log event would tell the possible failures apart.</text>
  <text x="50" y="967" font-size="14" fill="#2b2140">Recommends handler_entered (score 1); an extra Gateway timeout and a basic readiness check score 0.</text>
</svg>
